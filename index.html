<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample: Acme 13</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800&display=swap">
    <style type="text/tailwindcss">
@theme {
  --color-background: #ffffff;
  --color-foreground: #0a0a0a;
  --color-card: #ffffff;
  --color-card-foreground: #0a0a0a;
  --color-popover: #ffffff;
  --color-popover-foreground: #0a0a0a;
  --color-primary: #171717;
  --color-primary-foreground: #fafafa;
  --color-secondary: #f5f5f5;
  --color-secondary-foreground: #171717;
  --color-muted: #f5f5f5;
  --color-muted-foreground: #737373;
  --color-accent: #f5f5f5;
  --color-accent-foreground: #171717;
  --color-destructive: #dc2626;
  --color-border: #e5e5e5;
  --color-input: #e5e5e5;
  --color-ring: #a3a3a3;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 14px;
  --radius-2xl: 18px;
  --radius-3xl: 22px;
  --radius-4xl: 26px;
  --font-sans: "Inter", sans-serif;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --text-style-xs: 12px;
  --text-style-xs--line-height: 16px;
  --text-style-xs--font-weight: 400;
  --text-style-sm: 14px;
  --text-style-sm--line-height: 20px;
  --text-style-sm--font-weight: 400;
  --text-style-base: 16px;
  --text-style-base--line-height: 24px;
  --text-style-base--font-weight: 400;
  --text-style-lg: 18px;
  --text-style-lg--line-height: 28px;
  --text-style-lg--font-weight: 400;
  --text-style-xl: 20px;
  --text-style-xl--line-height: 28px;
  --text-style-xl--font-weight: 400;
  --text-style-2xl: 24px;
  --text-style-2xl--line-height: 32px;
  --text-style-2xl--font-weight: 600;
  --text-style-3xl: 30px;
  --text-style-3xl--line-height: 36px;
  --text-style-3xl--font-weight: 600;
  --text-style-4xl: 36px;
  --text-style-4xl--line-height: 40px;
  --text-style-4xl--font-weight: 800;
  --text-style-5xl: 48px;
  --text-style-5xl--line-height: 1;
  --text-style-5xl--font-weight: 800;
  --text-style-6xl: 60px;
  --text-style-6xl--line-height: 1;
  --text-style-6xl--font-weight: 800;
  --text-style-7xl: 72px;
  --text-style-7xl--line-height: 1;
  --text-style-7xl--font-weight: 800;
  --text-style-8xl: 96px;
  --text-style-8xl--line-height: 1;
  --text-style-8xl--font-weight: 800;
  --text-style-9xl: 128px;
  --text-style-9xl--line-height: 1;
  --text-style-9xl--font-weight: 800;
}
.dark {
  --color-background: #0a0a0a;
  --color-foreground: #fafafa;
  --color-card: #171717;
  --color-card-foreground: #fafafa;
  --color-popover: #171717;
  --color-popover-foreground: #fafafa;
  --color-primary: #e5e5e5;
  --color-primary-foreground: #171717;
  --color-secondary: #262626;
  --color-secondary-foreground: #fafafa;
  --color-muted: #262626;
  --color-muted-foreground: #a3a3a3;
  --color-accent: #262626;
  --color-accent-foreground: #fafafa;
  --color-destructive: #f87171;
  --color-border: #ffffff1a;
  --color-input: #ffffff26;
  --color-ring: #737373;
}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/compot-main.jsx"></script>
  </body>
</html>
